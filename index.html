/* ===================== MOTEUR (côté enseignant / local) ===================== */
let S=null,raf=null;
const info=()=>PERIODS[G.period];
const isOpen=k=>k.dec.open&&S.t>=(k.dec.early?S.per.start:S.per.open)&&S.t<S.per.close;
const price=(k,w)=>{const r=k.run,m=r.promo?.8:1;return (w==='plat'?r.pPlat:w==='drink'?r.pDrink:r.pForm)*m;};
function chooseTruck(a){let best=null,bu=-.4+gumbel();
 G.trucks.forEach(k=>{if(!isOpen(k))return;const g=a.g,r=k.run,q=QUAL[k.dec.quality];
  const ew=(r.queue.length+r.walking)/serviceRate(k,r.staff),pP=price(k,'plat');
  let U=1*g.prefs[k.spec]+3*(k.rep-.5)+1*(k.aw+r.awBoost+(k.equip.enseigne?(G.period==='soir'?.5:.28):0))
   +Math.log(SPOTS[k.dec.spot].bias[g.id])-g.priceSens*(pP/g.wtp-.85)*3.6-g.waitSens*(ew/a.pat)*2.4
   +g.qualSens*q.eff*3.5+((r.formule&&price(k,'form')<pP+price(k,'drink')-.4)?.3:0)+gumbel();
  if(U>bu){bu=U;best=k;}});
 return best;}
function spawn(a){const k=chooseTruck(a);if(!k){S.lost++;return;}
 k.run.st.chose++;k.run.walking++;const o=a.g.origin;
 S.agents.push({a,k,x:o[0]+rand(-40,40),y:o[1]+rand(-30,30),state:'walk',mood:null,joinT:0});}
const setLeave=ag=>{const o=ag.a.g.origin;ag.tx=o[0]+rand(-60,60);ag.ty=o[1]+rand(-40,40);};
function serveOne(k,ag){const r=k.run,a=ag.a,g=a.g,q=QUAL[k.dec.quality],wait=S.t-ag.joinT;let out,s;
 if(a.cardOnly&&!k.equip.tpe){out='carte';s=.25;}
 else if(r.stock<=0){out='rupture';s=.08;}
 else{const wtpP=g.wtp*a.noise*(1+q.eff*g.qualSens*1.4)*(1+.12*g.prefs[k.spec]),wtpD=g.drink*a.dNoise;
  const pP=price(k,'plat'),pD=price(k,'drink'),pF=price(k,'form');
  const opts=[{id:'plat',s:wtpP-pP,pay:pP,d:0},{id:'duo',s:wtpP-pP+wtpD-pD,pay:pP+pD,d:1}];
  if(r.formule)opts.push({id:'form',s:wtpP+wtpD-pF,pay:pF,d:1});
  opts.sort((x,y)=>y.s-x.s);const o=opts[0];
  if(o.s<0){out='prix';s=.4;}
  else{out='servi';r.stock--;r.st.plats++;r.st.ca+=o.pay;if(o.d)r.st.drinks++;if(o.id==='form')r.st.formules++;
   s=clamp(.55+.25*clamp(o.s/wtpP,-1,1)-.45*clamp(wait/a.pat,0,1.5)+q.eff*g.qualSens*1.6,0,1);}}
 r.st[out==='servi'?'served':out]++;r.st.sSum+=s;r.st.sN++;
 ag.state='leave';ag.mood=out==='servi'?(s>.6?'happy':'ok'):'bad';setLeave(ag);}
function moveTo(ag,tx,ty,sp){const dx=tx-ag.x,dy=ty-ag.y,d=Math.hypot(dx,dy);if(d<=sp){ag.x=tx;ag.y=ty;}else{ag.x+=dx/d*sp;ag.y+=dy/d*sp;}}
function step(dtReal){const per=S.per,len=per.close-per.start,dt=dtReal*S.speed*len/SERVICE_REAL_SEC;
 if(!S.ended){S.t+=dt;
  while(S.ai<S.arrivals.length&&S.arrivals[S.ai].t<=S.t){spawn(S.arrivals[S.ai]);S.ai++;}
  G.trucks.forEach(k=>{if(!k.dec.open)return;const r=k.run;
   r.pending=r.pending.filter(p=>{if(S.t>=p.t){r.stock+=p.n;return false;}return true;});
   if(!isOpen(k))return;
   r.progress+=serviceRate(k,r.staff)*dt;
   while(r.progress>=1&&r.queue.length){r.progress-=1;serveOne(k,r.queue.shift());}
   if(!r.queue.length)r.progress=Math.min(r.progress,1);
   for(let i=r.queue.length-1;i>=0;i--){const ag=r.queue[i];
    if(S.t-ag.joinT>ag.a.pat){r.queue.splice(i,1);r.st.abandon++;r.st.sN++;ag.state='leave';ag.mood='bad';setLeave(ag);}}});
  if(!S.midDone&&S.t>=per.mid){S.midDone=true;S.midOpen=true;
   G.trucks.forEach(k=>{if(k.dec.open)k.run.st.servedMid=k.run.st.served;if(!k.human&&k.dec.open)botMid(k);});
   G.phase='mid';if(NET.on&&G.role==='prof')pushState();renderMidPanel();}
  if(S.t>=per.close){S.ended=true;S.t=per.close;
   G.trucks.forEach(k=>{if(!k.dec.open)return;k.run.queue.forEach(ag=>{k.run.st.fermeture++;k.run.st.sSum+=.2;k.run.st.sN++;ag.state='leave';ag.mood='bad';setLeave(ag);});k.run.queue=[];});
   S.agents.forEach(ag=>{if(ag.state==='walk'){ag.k.run.walking--;ag.k.run.st.fermeture++;ag.k.run.st.sSum+=.2;ag.k.run.st.sN++;ag.state='leave';ag.mood='bad';setLeave(ag);}});}
 }else{S.endReal+=dtReal;if(S.endReal>1.5)S.done=true;}
 const sp=155*dt;
 S.agents.forEach(ag=>{
  if(ag.state==='walk'){const r=ag.k.run,tx=r.x,ty=r.y+r.dir*(40+r.queue.length*9);
   moveTo(ag,tx,ty,sp);if(Math.hypot(ag.x-tx,ag.y-ty)<3){ag.state='queue';ag.joinT=S.t;r.walking--;r.queue.push(ag);}}
  else if(ag.state==='queue'){const r=ag.k.run,i=r.queue.indexOf(ag),col=Math.floor(i/14),row=i%14;
   moveTo(ag,r.x+(col%2?1:-1)*Math.ceil(col/2)*12,r.y+r.dir*(40+row*10),sp);}
  else if(ag.state==='leave'){moveTo(ag,ag.tx,ag.ty,sp*1.15);if(Math.hypot(ag.x-ag.tx,ag.y-ag.ty)<4)ag.state='gone';}});
 S.agents=S.agents.filter(a=>a.state!=='gone');
 updateSide();}
function applyPick(k,id){const r=k.run;if(r.picks.length>=2||r.picks.includes(id))return;
 if(id==='extra'){r.staff++;r.st.extraCost+=MID_OPTS.extra.c;}
 else if(id==='stock'){r.st.urgentCost+=25*QUAL[k.dec.quality].cost*1.6;r.pending.push({t:S.t+10,n:25});}
 else if(id==='promo')r.promo=true;
 else if(id==='up'){r.pPlat+=1;r.pForm+=1;}
 else if(id==='down'){r.pPlat=Math.max(3,r.pPlat-1);r.pForm=Math.max(3,r.pForm-1);}
 else if(id==='pub'){r.awBoost+=.6;r.st.extraCost+=MID_OPTS.pub.c;}
 r.picks.push(id);}
function botMid(k){const r=k.run,q=r.queue.length,st=r.stock+r.pending.reduce((a,p)=>a+p.n,0),w=[];
 if(q>=8)w.push('extra');if(st<=10)w.push('stock');
 if(q<=1&&r.st.served<12)w.push(Math.random()<.5?'down':'pub');
 if(q>=14&&!w.includes('extra'))w.push('up');
 if(!w.length&&Math.random()<.4)w.push('pub');
 w.slice(0,2).forEach(id=>applyPick(k,id));}
function botDecide(t){const s=SPECS[t.spec],d=t.dec,per=PERIODS[G.period];
 d.open=true;d.early=Math.random()<.2;
 d.pPlat=Math.round(s.base*rand(.88,1.14)*2)/2;d.pDrink=Math.round(rand(2,3)*2)/2;
 d.formule=Math.random()<.7;d.pForm=d.pPlat+Math.round(rand(1,2)*2)/2;
 d.quality=t.cash>320&&Math.random()<.35?2:1;d.staff=t.cash>260?(Math.random()<.5?2:3):2;
 d.stock=Math.max(20,Math.round(per.perTruck*(.75+t.rep*.8)*(G.forecast.id==='pluie'?.7:1)*rand(.85,1.1)/5)*5);
 d.mkt=t.cash>220?[0,20,20,50][Math.floor(Math.random()*4)]:0;
 if(!d.spot||G.serviceNo===0){const r=Object.keys(SPOTS).map(k=>({k,v:SEGS.reduce((a,g)=>a+g.share[G.period]*SPOTS[k].bias[g.id]*(1+g.prefs[t.spec]),0)-SPOTS[k].fee/60})).sort((a,b)=>b.v-a.v);
  d.spot=(r.find(x=>spotCount(x.k,t)===0)||r[0]).k;}
 d.buy={};d.spy={};
 const target=G.trucks.filter(o=>o!==t&&o.lastReport).sort((a,b)=>b.lastReport.served-a.lastReport.served)[0];
 if(target&&t.cash>200&&Math.random()<.45){d.spy[target.id]=true;
  if(target.lastReport.served>(t.lastReport?t.lastReport.served:0))d.pPlat=Math.round((d.pPlat+(target.lastReport.pPlat-d.pPlat)*.35)*2)/2;
  d.pForm=d.pPlat+1.5;}
 if(!t.equip.tpe&&t.cash>260)d.buy.tpe=true;else if(!t.equip.four&&t.cash>520)d.buy.four=true;
 while(upfront(t)>t.cash&&d.stock>10)d.stock-=5;
 if(upfront(t)>t.cash){d.mkt=0;d.buy={};d.early=false;d.spy={};}
 t.validated=true;}

/* ===================== SYNCHRONISATION ===================== */
function publicTrucks(){return G.trucks.map(k=>({id:k.id,name:k.name,spec:k.spec,open:!!(k.dec&&k.dec.open),
 qlen:k.run?k.run.queue.length:0,wait:k.run?waitMin(k):0,x:k.run&&k.run.x!==undefined?k.run.x:SPOTS[k.dec.spot||'place'].x,
 y:k.run&&k.run.y!==undefined?k.run.y:SPOTS[k.dec.spot||'place'].y,rep:k.rep}));}
function privFor(k){
 const base={id:k.id,name:k.name,spec:k.spec,pin:k.pin,cash:k.cash,rep:k.rep,carry:k.carry,equip:k.equip,
  dec:k.dec,validated:k.validated,lastReport:k.lastReport,spots:spotOccupancy()};
 if(S&&k.run){const r=k.run;
  base.live={qlen:r.queue.length,wait:waitMin(k),stock:r.stock,served:r.st.served,ca:r.st.ca,staff:r.staff,promo:r.promo,
   prices:{plat:price(k,'plat'),drink:price(k,'drink'),form:r.formule?price(k,'form'):0},picks:r.picks,
   queue:r.queue.slice(0,16).map(ag=>({color:ag.a.g.color,pat:clamp((S.t-ag.joinT)/ag.a.pat,0,1)})),
   deçus:r.st.abandon+r.st.rupture+r.st.prix+r.st.carte};
  // rapports de veille payés par cette équipe
  base.intel=G.trucks.filter(o=>o!==k&&k.dec.spy[o.id]).map(o=>({name:o.name,spec:o.spec,open:!!o.dec.open,
   prix:o.run?price(o,'plat'):o.dec.pPlat,promo:o.run?o.run.promo:false,qlen:o.run?o.run.queue.length:0,wait:o.run?waitMin(o):0,
   served:o.run?o.run.st.served:0,stock:o.run?o.run.stock:0,staff:o.run?o.run.staff:o.dec.staff,
   picks:o.run?o.run.picks.map(p=>MID_OPTS[p].n):[],last:o.lastReport}));}
 else base.intel=G.trucks.filter(o=>o!==k&&k.dec.spy[o.id]).map(o=>({name:o.name,spec:o.spec,last:o.lastReport}));
 if(k.bilan)base.bilan=k.bilan;
 return base;}
function spotOccupancy(){const o={};Object.keys(SPOTS).forEach(s=>o[s]=G.trucks.filter(t=>t.dec.spot===s).map(t=>SPECS[t.spec].emoji));return o;}
function buildPayload(){
 const priv={};G.trucks.forEach(k=>priv[k.pin]=privFor(k));
 return {phase:G.phase,day:G.day,period:G.period,weather:G.weather?G.weather.id:null,forecast:G.forecast?G.forecast.id:null,
  clock:S?hhmm(S.t):null,t:S?S.t:null,ended:S?!!S.ended:false,pub:publicTrucks(),priv,
  market:S?{total:S.total,lost:S.lost}:null};}
let pushBusy=false,pushQueued=false,lastPush=0;
async function pushState(force){
 if(!NET.on||G.role!=='prof'||!G.code)return;
 const now=performance.now();
 if(!force&&now-lastPush<800){pushQueued=true;return;}
 if(pushBusy){pushQueued=true;return;}
 pushBusy=true;lastPush=now;
 try{await NET.saveSession(G.code,buildPayload());netStatus('🟢 synchronisé');}
 catch(e){netStatus('⚠️ réseau : '+String(e).slice(0,60),true);}
 pushBusy=false;
 if(pushQueued){pushQueued=false;setTimeout(()=>pushState(),200);}}
async function pollDecisions(){
 if(!NET.on||G.role!=='prof'||!G.code)return;
 try{const rows=await NET.getDecisions(G.code,G.lastDecId)||[];
  rows.forEach(r=>{G.lastDecId=Math.max(G.lastDecId,r.id);
   const k=G.trucks.find(t=>t.id===r.truck&&t.pin===String(r.pin));if(!k)return;
   if(r.kind==='dec'&&G.phase==='decisions'){Object.assign(k.dec,r.data);k.dec.buy=r.data.buy||{};k.dec.spy=r.data.spy||{};
    k.dec.pPlat=clamp(+k.dec.pPlat||3,3,25);k.dec.pDrink=clamp(+k.dec.pDrink||1,1,8);k.dec.pForm=clamp(+k.dec.pForm||3,3,30);
    k.dec.stock=clamp(Math.round(+k.dec.stock||0),0,250);k.dec.staff=clamp(Math.round(+k.dec.staff||1),1,4);
    if(upfront(k)>k.cash){while(upfront(k)>k.cash&&k.dec.stock>0)k.dec.stock-=5;}
    k.validated=true;if(G.phase==='decisions')renderProfDecisions();}
   else if(r.kind==='mid'&&S&&S.midOpen){(r.data.picks||[]).slice(0,2).forEach(id=>{if(MID_OPTS[id])applyPick(k,id);});renderMidPanel();}});
  if(rows.length)pushState();
 }catch(e){netStatus('⚠️ réseau : '+String(e).slice(0,60),true);}}

function prepareService(){
 G.forecast=WEATHER[Math.floor(Math.random()*3)];
 G.weather=Math.random()<.75?G.forecast:WEATHER[Math.floor(Math.random()*3)];
 G.trucks.forEach(t=>{t.validated=false;t.dec.buy={};t.dec.spy={};if(!t.human)botDecide(t);});
 G.trucks.forEach(t=>{if(!t.dec.spot||spotCount(t.dec.spot,t)>=2)t.dec.spot=Object.keys(SPOTS).find(s=>spotCount(s,t)===0)||Object.keys(SPOTS).find(s=>spotCount(s,t)<2);});
 G.phase='decisions';G.tab=Math.max(0,G.trucks.findIndex(t=>t.human));
 if(NET.on)pushState(true);
 if(NET.on)renderProfDecisions();else renderLocalDecisions();}

function finishService(){
 const results=G.trucks.map(k=>{
  if(!k.dec.open){k.cash-=LOAN;k.rep=k.rep*.97+.015;k.aw*=.5;k.lastReport=null;k.bilan={closed:true};return{k,closed:true,result:-LOAN};}
  const r=k.run,st=r.st,d=k.dec,unsold=Math.max(0,r.stock);
  const ing=d.stock*QUAL[d.quality].cost,dr=st.drinks*DRINK_COST,sal=(d.staff-1)*SALARY+st.extraCost;
  const fee=SPOTS[d.spot].fee,early=d.early?EARLY_COST:0,spy=spyCount(k)*SPY_COST;
  const equipCost=Object.keys(d.buy).reduce((a,e)=>a+(d.buy[e]?EQUIP[e].cost:0),0);
  const costs=ing+dr+sal+d.mkt+fee+early+spy+st.urgentCost+LOAN;
  const result=st.ca-costs;
  k.cash+=st.ca-dr-sal-st.urgentCost-LOAN;
  const va=st.ca-(ing+dr+d.mkt+fee+early+spy+st.urgentCost);
  const repBefore=k.rep;
  if(st.sN>0)k.rep=clamp(.6*k.rep+.4*(st.sSum/st.sN),.05,1);
  k.aw*=.5;k.carry=k.equip.frigo?Math.floor(unsold*.6):0;
  k.totals.ca+=st.ca;k.totals.served+=st.served;k.totals.va+=va;
  k.lastReport={pPlat:d.pPlat,pDrink:d.pDrink,pForm:d.pForm,formule:d.formule,quality:d.quality,staff:d.staff,spot:d.spot,mkt:d.mkt,
   served:st.served,rep:k.rep,equip:Object.keys(k.equip).filter(e=>k.equip[e]).map(e=>EQUIP[e].name)};
  return{k,st,unsold,ing,dr,sal,equipCost,fee,early,spy,costs,result,va,repBefore};});
 const totalServed=results.reduce((a,x)=>a+(x.st?x.st.served:0),0)||1;
 results.forEach(x=>{if(!x.closed)x.k.bilan={served:x.st.served,ca:x.st.ca,costs:x.costs,result:x.result,cash:x.k.cash,rep:x.k.rep,
  unsold:x.unsold,abandon:x.st.abandon+x.st.fermeture,rupture:x.st.rupture,prix:x.st.prix,carte:x.st.carte,
  share:Math.round(x.st.served/totalServed*100),analyse:analyse(x,totalServed,results)};});

 renderBilan(results,totalServed);}
function analyse(x,totalServed,all){
 const k=x.k,st=x.st,d=k.dec,r=k.run,out=[];const add=(n,h)=>out.push(`<p><span class="chip">${n}</span>${h}</p>`);

 const capa=Math.round(serviceRate(k,d.staff)*(S.per.close-(d.early?S.per.start:S.per.open)));
 if(lost>=Math.max(4,st.chose*.1)){const gain=Math.round(Math.min(lost,(serviceRate(k,d.staff+1)-serviceRate(k,d.staff))*(S.per.close-S.per.open)));
  add('Rareté · raisonnement à la marge',`<b>${lost} clients repartis sans être servis.</b> Votre capacité était la ressource rare : une personne de plus coûte ${SALARY} € et aurait servi environ ${gain} clients, soit ${fmt0(gain*d.pPlat)} de recettes.`);}
 if(st.rupture>0)add('Rareté',`<b>${st.rupture} clients face à une rupture de stock.</b> Ils ont attendu pour rien : ventes perdues et réputation abîmée.`);
 if(st.served>=capa*.8&&lost<Math.max(4,st.chose*.1))add('Capacité · concurrence',`Vous avez tourné à <b>${Math.round(st.served/capa*100)} % de votre capacité</b>. Les clients qui voient une file trop longue ne s’y mettent même pas : ce manque à gagner n’apparaît pas dans vos comptes, mais dans votre part de marché.`);
 if(x.unsold>=Math.max(5,d.stock*.15))add('Raisonnement à la marge',`<b>${x.unsold} plats invendus</b>${k.equip.frigo?` (dont ${k.carry} conservés)`:''} : recette marginale nulle, ${fmt0(x.unsold*QUAL[d.quality].cost)} perdus.`);
 if(st.prix>=Math.max(3,st.chose*.07))add('Utilité',`<b>${st.prix} clients ont renoncé au comptoir</b> : pour eux, la satisfaction attendue valait moins que ${fmt(d.pPlat)}.`);
 if(st.carte>=3)add('Monnaie',`<b>${st.carte} clients n’avaient que leur carte</b> et sont repartis. Un terminal coûte ${EQUIP.tpe.cost} €.`);
 if(d.formule&&st.served>0){const rate=Math.round(st.formules/st.served*100);
  add('Utilité marginale',`<b>${rate} % de formules.</b> ${rate>40?'La boisson seule apportait trop peu de satisfaction pour son prix : le petit supplément de la formule a suffi.':'Peu de succès : l’écart entre formule et plat seul reste trop élevé.'}`);}
 if(spyCount(k))add('Information',`Veille payée <b>${fmt(spyCount(k)*SPY_COST)}</b>. L’information a un prix, et vous ne l’achetez qu’en renonçant à autre chose.`);
 if(r.picks.length)add('Décisions de mi-service',`<b>${r.picks.map(p=>MID_OPTS[p].n).join(' et ')}</b>. Servis avant la pause : ${st.servedMid} ; après : <b>${st.served-st.servedMid}</b>.`);
 const cheaper=all.filter(o=>o.st&&o.k!==k&&o.k.dec.pPlat<d.pPlat).length;
 add('Concurrence',`Part de marché <b>${Math.round(st.served/totalServed*100)} %</b>. ${cheaper?`${cheaper} concurrent${cheaper>1?'s':''} moins cher${cheaper>1?'s':''}.`:'Vous étiez le moins cher.'} Réputation ${stars(x.repBefore)} → <b>${stars(k.rep)}</b>.`);
 return out.join('');}

  if(E.payload.phase!==E.lastPhase){E.lastPhase=E.payload.phase;E.sent=false;E.picks=[];renderStudent(true);}
  else renderStudent(false);
 }catch(e){netStatus('⚠️ réseau',true);}}
function studentTruck(){const me=E.payload.priv[E.pin];
 const t={id:me.id,name:me.name,spec:me.spec,cash:me.cash,rep:me.rep,carry:me.carry,equip:me.equip,dec:me.dec,
  validated:E.sent,lastReport:me.lastReport,spotsInfo:me.spots,
  rivals:E.payload.pub.filter(o=>o.id!==me.id).map(o=>{const intel=(me.intel||[]).find(x=>x.name===o.name);
   return{id:o.id,name:o.name,spec:o.spec,last:intel?intel.last:null};}),bilan:me.bilan};
 return t;}
function renderStudent(full){
 const me=E.payload.priv[E.pin],ph=E.payload.phase,s=SPECS[me.spec];
 $('roleTag').textContent='Votre camion · code de partie '+E.code;
 $('title').textContent=s.emoji+' '+me.name;
 if(ph==='lobby'){app.innerHTML=`<div class="panel"><h2>En attente du professeur</h2>
   <p class="lede">Vous pilotez <b>${s.emoji} ${esc(me.name)}</b> (${s.name}). Trésorerie de départ : <b>${fmt(me.cash)}</b>. Le premier service va bientôt être préparé.</p></div>`;return;}
 if(ph==='decisions'){
  if(!full&&document.getElementById('sdec'))return;
  app.innerHTML=`<div class="panel"><div class="row" style="justify-content:space-between">
    <h2 style="margin:0">Jour ${E.payload.day} — ${PERIODS[E.payload.period].label}</h2><span class="forecast">Prévision : ${(WEATHER.find(w=>w.id===E.payload.forecast)||{}).label||''}</span></div>
   <p class="lede" style="margin-top:6px">Préparez votre service puis envoyez vos décisions. Vous pourrez encore les modifier tant que le professeur n’a pas lancé le service.</p>
   <div id="sdec"></div></div>`;
  const t=studentTruck();G.trucks=[t];
  const host=$('sdec');
  const redraw=()=>{t.validated=E.sent;decForm(t,host,redraw,async()=>{
    try{await NET.sendDecision(E.code,t.id,E.pin,'dec',t.dec);E.sent=true;netStatus('🟢 décisions envoyées');}
    catch(e){netStatus('⚠️ envoi impossible',true);}
    redraw();});
   if(E.sent)host.insertAdjacentHTML('beforeend','<div class="preview">✅ Décisions envoyées au professeur. Vous pouvez encore les modifier et les renvoyer.</div>');};
  redraw();return;}
 if(ph==='service'||ph==='mid'){
  if(full||!document.getElementById('scv')){
   app.innerHTML=`<div class="panel" style="padding:12px"><canvas id="scv" width="1000" height="620"></canvas>
    <div id="smid"></div></div>`;}
  const live=me.live||{qlen:0,wait:0,stock:0,served:0,ca:0,staff:1,promo:false,prices:{plat:0,drink:0,form:0},queue:[]};
  const c=$('scv').getContext('2d');
  drawCounter(c,{spec:me.spec,name:me.name,prices:live.prices,promo:live.promo,stock:live.stock,served:live.served,ca:live.ca,
   rep:me.rep,staff:live.staff,queue:live.queue,qlen:live.qlen,wait:live.wait,open:!!me.dec.open,clock:E.payload.clock||'',
   night:PERIODS[E.payload.period].night,weather:E.payload.weather,
   others:E.payload.pub.filter(o=>o.id!==me.id).map(o=>({spec:o.spec,name:o.name,qlen:o.qlen,wait:o.wait,open:o.open}))});
  const box=$('smid');
  if(ph==='mid'){
   const picks=(live.picks&&live.picks.length)?live.picks:E.picks;
   const intel=(me.intel||[]).length?`<div class="box" style="margin-top:10px"><b>🔍 Rapport de votre observateur</b>${me.intel.map(o=>
     `<div class="intel">${SPECS[o.spec].emoji} <b>${esc(o.name)}</b> : ${o.open===false?'fermé':`plat <b>${fmt(o.prix)}</b>${o.promo?' (promo)':''} · file <b>${o.qlen}</b> (⏱ ${Math.round(o.wait)} min) · <b>${o.served}</b> servis · stock <b>${o.stock}</b> · <b>${o.staff}</b> au service${o.picks&&o.picks.length?' · vient de décider : '+o.picks.join(' et '):''}`}</div>`).join('')}</div>`:'';
   box.innerHTML=`<div class="midwrap"><h2 style="margin:0">⏸ Pause — ${E.payload.clock}</h2>
    <p class="lede" style="font-size:13.5px">File <b>${live.qlen}</b> (⏱ ${Math.round(live.wait)} min) · servis <b>${live.served}</b> · stock <b>${live.stock}</b> · CA <b>${fmt0(live.ca)}</b>. Choisissez jusqu’à <b>2 décisions</b>.</p>
    ${intel}
    <div style="margin-top:10px">${Object.keys(MID_OPTS).map(id=>{const o=MID_OPTS[id],on=picks.includes(id);
      return `<div class="opt ${on?'on':''} ${!on&&picks.length>=2?'dis':''}" data-op="${id}"><span>${on?'✅':'⬜'}</span><span><b>${o.n}${o.c?' — '+o.c+' €':''}</b>${o.d}<span class="why2"> ${o.w}</span></span></div>`;}).join('')}</div>
    <div class="controls"><span class="why" style="color:var(--ink-soft)">${picks.length}/2 choisies${E.sentMid?' · envoyées ✅':''}</span>
     <button class="btn go" id="sendMid" ${picks.length&&!E.sentMid?'':'disabled'}>Envoyer mes décisions</button></div></div>`;
   box.onclick=async e=>{
    const o=e.target.closest('[data-op]');
    if(o&&!o.classList.contains('dis')&&!o.classList.contains('on')&&!E.sentMid){
     if(E.picks.length<2&&!E.picks.includes(o.dataset.op)){E.picks.push(o.dataset.op);renderStudent(false);}return;}
    if(e.target.id==='sendMid'){try{await NET.sendDecision(E.code,me.id,E.pin,'mid',{picks:E.picks});E.sentMid=true;netStatus('🟢 décisions envoyées');renderStudent(false);}catch(err){netStatus('⚠️ envoi impossible',true);}}};
  } else { box.innerHTML='';E.sentMid=false; }
  return;}
 if(ph==='bilan'||ph==='final'){
  const b=me.bilan;
  app.innerHTML=`<div class="panel"><h2>Votre bilan — jour ${E.payload.day}, ${PERIODS[E.payload.period].label.toLowerCase()}</h2>
   ${b&&!b.closed?`<div class="impact">
     <div class="imp"><div class="k">Clients servis</div><div class="v">${b.served}</div><div class="d">part de marché ${b.share} %</div></div>
     <div class="imp"><div class="k">Chiffre d’affaires</div><div class="v">${fmt0(b.ca)}</div><div class="d">charges ${fmt0(b.costs)}</div></div>
     <div class="imp ${b.result<0?'warn':''}"><div class="k">Résultat</div><div class="v">${b.result>=0?'+':''}${fmt0(b.result)}</div><div class="d">trésorerie ${fmt0(b.cash)}</div></div>
     <div class="imp ${b.abandon+b.rupture>6?'warn':''}"><div class="k">Clients perdus</div><div class="v">${b.abandon+b.rupture+b.prix+b.carte}</div><div class="d">${b.abandon} partis de la file · ${b.rupture} ruptures · ${b.prix} prix trop élevé</div></div></div>
    <h3 style="margin-top:18px">Ce que disent vos chiffres</h3><div class="an-card" style="--c:${s.color}">${b.analyse}</div>`
   :'<p class="lede">Camion fermé pour ce service.</p>'}
   <p class="lede" style="margin-top:14px">Attendez que le professeur lance le service suivant.</p></div>`;
  return;}}

/* ===================== DÉMARRAGE ===================== */
function boot(){
 const url=new URL(location.href),code=url.searchParams.get('code');
 const isStudent=!!(code||url.searchParams.get('role')==='eleve');
 G.role=isStudent?'eleve':'prof';
 topActions();
 if(isStudent){
  if(!NET.on){app.innerHTML='<div class="panel"><h2>Configuration manquante</h2><p class="lede">Le mode élève nécessite la configuration Supabase en haut du fichier (voir README.md).</p></div>';return;}
  E.code=(code||'').toUpperCase();
  const saved=localStorage.getItem('ftw');
  if(saved){try{const s=JSON.parse(saved);if(s.code===E.code){E.pin=s.pin;NET.getSession(E.code).then(rows=>{
    if(rows&&rows.length&&rows[0].payload.priv[E.pin]){E.payload=rows[0].payload;startStudentLoop();}else renderStudentLogin();});return;}}catch(e){}}
  renderStudentLogin();return;}
 $('roleTag').textContent='Console enseignant · Économie Première STMG';
 renderProfSetup();}
boot();
})();
</script>
